workflows:
  ios-release:
    name: iOS release
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Rakt Pravah
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.bloodlink.bloodlink
      vars:
        BUNDLE_ID: com.bloodlink.bloodlink
        # Base64 of the GoogleService-Info.plist downloaded from the Firebase
        # console (project nobloodlink, iOS app com.bloodlink.bloodlink).
        # Add it as a secure variable named IOS_GOOGLE_SERVICE_INFO_PLIST.
      groups:
        - firebase
    scripts:
      - name: Add Firebase config
        script: |
          echo "$IOS_GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > ios/Runner/GoogleService-Info.plist
      - name: Get packages
        script: flutter pub get
      - name: Analyze and test
        script: |
          flutter analyze
          flutter test
      - name: Install pods
        script: |
          cd ios
          pod install
      - name: Apply signing
        script: xcode-project use-profiles
      - name: Build IPA
        script: |
          flutter build ipa --release \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - flutter_drive.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
