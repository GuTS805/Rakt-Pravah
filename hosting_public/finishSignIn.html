<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Verifying your email — BloodLink</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff5f4;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #1a1a1a;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }
    .card {
      max-width: 360px;
    }
    .mark {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: #d9342b;
      margin: 0 auto 20px;
    }
    h1 {
      font-size: 20px;
      margin: 0 0 8px;
    }
    p {
      font-size: 15px;
      line-height: 1.5;
      color: #555;
      margin: 0 0 20px;
    }
    a.button {
      display: inline-block;
      background: #d9342b;
      color: #fff;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 999px;
      font-weight: 600;
      font-size: 15px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="mark"></div>
    <h1>Opening BloodLink&hellip;</h1>
    <p>
      If the app didn't open on its own, make sure BloodLink is installed on
      this phone, then go back to the email and tap the verification link
      again.
    </p>
    <a class="button" href="intent://finishSignIn#Intent;scheme=https;package=com.bloodlink.bloodlink;end">
      Open BloodLink
    </a>
  </div>
</body>
</html>
